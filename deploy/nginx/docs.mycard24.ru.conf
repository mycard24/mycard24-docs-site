# TLS termination for the documentation — docs.mycard24.ru.
#
# Docusaurus output is a real HTML file per route (trailingSlash is on), so there is no SPA fallback
# here. A genuine miss gets the site's own 404.html.
#
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled/, then
# `nginx -t && systemctl reload nginx`.

upstream mycard24_docs_site {
    # Matches DOCS_PORT in /opt/mycard24-docs-site/.env.
    server 127.0.0.1:8088;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.mycard24.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name docs.mycard24.ru;

    # A single wildcard for *.mycard24.ru, issued with acme.sh over the Cloudflare DNS API. One
    # certificate covers every subdomain, so a new vhost needs no new certificate.
    ssl_certificate     /etc/ssl/mycard24.ru.pem;
    ssl_certificate_key /etc/ssl/mycard24.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # No ssl_stapling: Let's Encrypt stopped publishing an OCSP responder URL in its certificates,
    # so nginx ignores the directive and warns about it on every reload. Dead config that costs a
    # line of noise each time somebody checks the server.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    # Fingerprinted by the build, so the name changes whenever the content does.
    location /assets/ {
        proxy_pass http://mycard24_docs_site;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";

        # static-web-server sends its own Cache-Control; hide it or the directive goes out twice.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://mycard24_docs_site;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # HTML must revalidate. These are legal documents: an updated policy must never be served
        # from a cache after it changes.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        proxy_intercept_errors on;
        error_page 404 = @notfound;
        error_page 502 503 504 = @unavailable;
    }

    location @notfound {
        rewrite ^ /404.html break;
        proxy_pass http://mycard24_docs_site;
        proxy_set_header Host $host;
    }

    location @unavailable {
        default_type text/html;
        return 503 "<!doctype html><meta charset=utf-8><title>МояКарта24</title><body style=\"font-family:system-ui;margin:4rem auto;max-width:32rem;line-height:1.6\"><h1>Документация недоступна</h1><p>Сервис временно недоступен. Попробуйте позже.</p><p><a href=\"https://mycard24.ru\">На главную</a></p></body>";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;
}
