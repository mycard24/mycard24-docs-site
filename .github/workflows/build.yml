name: Build

# The one place the site is ever built. CI and Deploy both call it so that what gets published is
# produced by exactly the steps that were validated on develop and in the pull request.

on:
  workflow_call:
    inputs:
      docs_ref:
        description: Branch of mycard24-docs to build the pages from.
        required: true
        type: string
    secrets:
      DOCS_REPO_TOKEN:
        description: Only needed while mycard24-docs is private; the default token can read it while
          it is public.
        required: false
      DOCSEARCH_APP_ID:
        required: false
      DOCSEARCH_API_KEY:
        required: false
      DOCSEARCH_INDEX_NAME:
        required: false

jobs:
  build:
    name: Build (content @ ${{ inputs.docs_ref }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/stage-content
        with:
          docs_ref: ${{ inputs.docs_ref }}
          token: ${{ secrets.DOCS_REPO_TOKEN }}

      - run: npm run typecheck

      - run: npm run build
        env:
          DOCSEARCH_APP_ID: ${{ secrets.DOCSEARCH_APP_ID }}
          DOCSEARCH_API_KEY: ${{ secrets.DOCSEARCH_API_KEY }}
          DOCSEARCH_INDEX_NAME: ${{ secrets.DOCSEARCH_INDEX_NAME }}

      - name: Verify the pages that must never 404
        run: |
          set -euo pipefail
          for path in \
            build/index.html \
            build/legal/offer/index.html \
            build/legal/terms/index.html \
            build/legal/consent/index.html \
            build/legal/privacy_policy/index.html \
            build/legal/cookies/index.html
          do
            test -f "$path" || { echo "::error::missing $path"; exit 1; }
          done

          echo "every required page is present"
